name: pri-website

# Local Postgres for this app's own state (dataset visibility overrides +
# access requests — the "Module C v0" thin layer in front of CKAN). This is
# separate from pri-ckan's own Postgres (CKAN's catalog DB), so this repo
# doesn't depend on the pri-ckan checkout/stack existing to run its own DB.
services:
  db:
    image: postgres:16-alpine
    container_name: pri-website-db
    environment:
      POSTGRES_USER: pri
      POSTGRES_PASSWORD: pri_dev_password
      POSTGRES_DB: pri_website
    ports:
      - "5434:5432"
    volumes:
      - pri_website_pg:/var/lib/postgresql/data

volumes:
  pri_website_pg:
