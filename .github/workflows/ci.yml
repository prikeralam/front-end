name: CI

# Checks run once per change, on its pull request. Not again on the push to dev (the squash merge of a
# green PR), not for docs-only changes, and not on the dev -> staging and staging -> main promotion PRs,
# whose code already passed on its own PR. Hotfix and backport PRs are checked as usual.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      !((github.base_ref == 'staging' && github.head_ref == 'dev') ||
      (github.base_ref == 'main' && github.head_ref == 'staging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    if: >-
      !((github.base_ref == 'staging' && github.head_ref == 'dev') ||
      (github.base_ref == 'main' && github.head_ref == 'staging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next generates global types such as LayoutProps into .next/types; a fresh checkout has none yet.
      - run: npx next typegen
      - run: npx tsc --noEmit

  test:
    if: >-
      !((github.base_ref == 'staging' && github.head_ref == 'dev') ||
      (github.base_ref == 'main' && github.head_ref == 'staging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: >-
      !((github.base_ref == 'staging' && github.head_ref == 'dev') ||
      (github.base_ref == 'main' && github.head_ref == 'staging'))
    runs-on: ubuntu-latest
    env:
      # No backend runs in CI: pages that read the API prerender their error state, which still proves they build.
      API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    if: >-
      !((github.base_ref == 'staging' && github.head_ref == 'dev') ||
      (github.base_ref == 'main' && github.head_ref == 'staging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pri-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container serves /healthz with no backend reachable
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=http://127.0.0.1:9 pri-frontend:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && exit 0; sleep 2; done
          docker logs web
          exit 1
